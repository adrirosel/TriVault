target-version = "py311"
line-length = 130
extend-exclude = ["alembic/versions"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "B008",   # FastAPI Depends()/Query() en argumentos por defecto
  "UP042",  # str+Enum -> StrEnum cambiaría la semántica de str()
]

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]  # las variables de entorno deben fijarse antes de importar la app
